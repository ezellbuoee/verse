{{- $ns := .Release.Namespace -}}
{{- $db := printf "%s-db" (include "verse.name" .) -}}
{{- $app := printf "%s-app" (include "verse.name" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $db }}
  labels: {{- include "verse.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ include "verse.keep" (dict "ns" $ns "secret" $db "key" "password" "value" .Values.postgres.password) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $app }}
  labels: {{- include "verse.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwtSecret: {{ include "verse.keep" (dict "ns" $ns "secret" $app "key" "jwtSecret" "value" .Values.auth.jwtSecret) | quote }}
  {{- if .Values.bootstrapAdmin.email }}
  adminEmail: {{ .Values.bootstrapAdmin.email | quote }}
  adminPassword: {{ include "verse.keep" (dict "ns" $ns "secret" $app "key" "adminPassword" "value" .Values.bootstrapAdmin.password) | quote }}
  {{- end }}
