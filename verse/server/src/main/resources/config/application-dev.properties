# Local development: an H2 file database under server/data, sample members and posts, readable logs.
server.port=8082
server.address=127.0.0.1
logging.level.com.verse=DEBUG
logging.config=classpath:logback-dev.xml

spring.datasource.url=jdbc:h2:file:./data/verse-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

verse.auth.jwt-secret=dev-only-secret-do-not-use-in-production-0123456789
verse.cors.allowed-origins=http://localhost:8020

verse.seed.samples=true
verse.seed.dev-members=true
management.endpoint.health.show-details=always
