apiVersion: v1
kind: Service
metadata:
  name: {{ include "verse.name" . }}-frontend
  labels: {{- include "verse.labels" . | nindent 4 }}
spec:
  selector: {{- include "verse.selector" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports: [ { name: http, port: 80, targetPort: http } ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "verse.name" . }}-frontend
  labels: {{- include "verse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: {{- include "verse.selector" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels: {{- include "verse.selector" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nginx
          image: {{ include "verse.image" (dict "root" . "name" .Values.image.frontend) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "verse.containerSecurity" . | nindent 12 }}
          env:
            - { name: VERSE_SERVER_URL, value: "http://{{ include "verse.name" . }}-server:8080" }
          ports: [ { name: http, containerPort: 8020 } ]
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
