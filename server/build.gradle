import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java'
    alias(gradlePluginLibs.plugins.spring.boot)
    alias(gradlePluginLibs.plugins.test.logger)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

dependencies {
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation libs.springdoc
    implementation libs.logstash
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    // dev profile and tests: a file / in-memory database, no install needed
    runtimeOnly 'com.h2database:h2'

    developmentOnly platform(SpringBootPlugin.BOM_COORDINATES)
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

springBoot {
    mainClass = 'com.verse.server.VerseServerApplication'
    buildInfo {
        properties {
            version = project.version
        }
    }
}

// `./gradlew :server:bootRun` starts with the dev profile (H2 file database, sample members) unless told otherwise
tasks.named('bootRun') {
    systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'dev')
    workingDir = projectDir
}

tasks.named('jar') {
    enabled = false
}

if (!skipCheckstyle.toBoolean()) {
    apply plugin: 'checkstyle'
    checkstyle {
        toolVersion = checkstyleVersion
        configFile = rootProject.file('quality/checkstyle/checkstyle.xml')
        configProperties = ['importControlFile': rootProject.file('quality/checkstyle/import-control.xml').path]
        ignoreFailures = false
    }
}
