spring.application.name=verse
server.port=8080

# Database: PostgreSQL by default (production), see application-dev.properties for the zero-setup H2 database.
spring.datasource.url=${VERSE_DB_URL:jdbc:postgresql://localhost:5432/verse}
spring.datasource.username=${VERSE_DB_USERNAME:verse}
spring.datasource.password=${VERSE_DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true

# Sign-in tokens (HS256). The secret must be at least 32 characters; there is no default outside the dev profile.
verse.auth.jwt-secret=${VERSE_JWT_SECRET:}
verse.auth.token-ttl=${VERSE_TOKEN_TTL:7d}
# Browser origins allowed to call the API from another host (comma separated). Same-origin calls need nothing.
verse.cors.allowed-origins=${VERSE_PUBLIC_URL:}

# Bootstrap admin: created (or promoted) at startup when both are set. Remove them once you have your own admin.
verse.bootstrap-admin.email=${VERSE_ADMIN_EMAIL:}
verse.bootstrap-admin.password=${VERSE_ADMIN_PASSWORD:}
verse.bootstrap-admin.display-name=${VERSE_ADMIN_NAME:Admin}

# Seed data, loaded once into an empty database.
verse.seed.classics=${VERSE_SEED_CLASSICS:true}
verse.seed.samples=false
verse.seed.dev-members=false

# API docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.verse.server.api
springdoc.default-produces-media-type=application/json
spring.mvc.problemdetails.enabled=true

# Health for probes: /actuator/health, /actuator/health/liveness, /actuator/health/readiness
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

server.max-http-request-header-size=48KB
logging.level.root=INFO
